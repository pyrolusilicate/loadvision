{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Loadvision</h1>
  <p class="muted">Проверка загрузки кузова по фото. Аккаунт выдаёт администратор командой
    <code>loadvision operators add</code>.</p>
  {% if error %}<p class="note bad" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ ui }}/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="login">Логин</label>
    <input id="login" name="login" type="text" value="{{ login or '' }}" autocomplete="username"
           autofocus required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
</section>
{% endblock %}
