<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Loadvision{% endblock %} · Loadvision</title>
  <link rel="stylesheet" href="{{ stylesheet() }}">
</head>
<body>
{% if session %}
{% set here = request.url.path %}
<header>
  <a href="{{ ui }}/" class="logo">Loadvision</a>
  <nav>
    <a href="{{ ui }}/" class="section {% if here == ui ~ '/' or here.startswith(ui ~ '/assessments') %}on{% endif %}">Очередь</a>
    <a href="{{ ui }}/shipments" class="section {% if here.startswith(ui ~ '/shipments') %}on{% endif %}">Перевозки</a>
    <a href="{{ ui }}/models" class="section {% if here.startswith(ui ~ '/models') %}on{% endif %}">Модели</a>
    <a href="{{ ui }}/jobs" class="section {% if here.startswith(ui ~ '/jobs') %}on{% endif %}">Дообучение</a>
  </nav>
  <div class="who">
    {% if model_version %}
    <span class="badge ok" title="Версия модели, которой отвечает сервис">{{ model_version }}</span>
    {% elif model_failure %}
    <span class="badge bad" title="Причина — на странице «Модели»">модель не загрузилась</span>
    {% else %}
    <span class="badge warn" title="Оценка фото вернёт 503, пока модель не загрузится">модель загружается</span>
    {% endif %}
    <span class="muted">{{ session.login }}</span>
    <form method="post" action="{{ ui }}/logout">
      <input type="hidden" name="csrf" value="{{ session.csrf }}">
      <button type="submit" class="ghost">выйти</button>
    </form>
  </div>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
