# Alembic settings. The database URL is never stored here: env.py reads DATABASE_URL.
#   just db-migrate            apply migrations to the database from .env
#   uv run --env-file .env alembic revision --autogenerate --rev-id 0002 -m "add something"

[alembic]
# A package path, so migrations are found both in the repository and in an installed image.
script_location = loadvision.infrastructure.db:migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
