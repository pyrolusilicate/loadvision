services:
  postgres:
    # The official image through Google's mirror of Docker Hub, which Russian networks often cannot
    # reach.
    image: mirror.gcr.io/library/postgres:18-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql, not /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies migrations and exits; the API starts only after it succeeds.
  migrate:
    image: loadvision-api
    build: &api-build
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &database
      # An empty URL makes psycopg take the connection from the PG* variables, so a password
      # with characters such as "@" or "/" needs no escaping inside a URL.
      DATABASE_URL: postgresql+psycopg://
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: loadvision-api
    build: *api-build
    environment: *database
    ports:
      - "8000:8000"
    volumes:
      # Photos and model packages stay on the host; a package is storage/models/<version>/.
      - ./storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health answers 200 only once the model has loaded.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Retrains on confirmed labels. Started on its own, `just worker`, so `just up` stays light.
  worker:
    image: loadvision-worker
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    profiles: ["worker"]
    environment: *database
    volumes:
      # The folders a run from the repository uses: the base dataset, runs with the embedding
      # cache, photos and model packages, and configs with the folds file the worker extends.
      - ./data:/app/data:ro
      - ./runs:/app/runs
      - ./storage:/app/storage
      - ./configs:/app/configs
      # A package carries the licence text of every checkpoint it ships, and the build stops
      # without it: the texts travel with the repository, like the configs above.
      - ./licenses:/app/licenses:ro
      # Encoder checkpoints downloaded for training, kept between containers.
      - hf-cache:/home/loadvision/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  hf-cache:
