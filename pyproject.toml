[project]
name = "loadvision"
version = "0.1.0"
description = "Truck cargo load estimation from photos with an XML API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["baseline", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "T20", "PTH", "D"]
# D1: docstrings are not forced on every object; RUF001-003: Cyrillic text is expected.
ignore = ["D1", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["loadvision"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["baseline", "data", "runs", "storage", "**/__pycache__"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["src/loadvision/domain", "src/loadvision/application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
markers = [
    "unit: fast tests without external services",
    "contract: XML responses checked against the XSD",
    "api: HTTP API behavior",
    "ml: pipeline stages on synthetic data",
    "integration: tests with a real Postgres",
    "e2e: full service scenarios",
    "data: quality regression on the real dataset",
]

[tool.importlinter]
root_package = "loadvision"

[[tool.importlinter.contracts]]
name = "Layers: entry points -> adapters -> application -> domain"
type = "layers"
layers = [
    "loadvision.api | loadvision.cli",
    "loadvision.infrastructure | loadvision.ml",
    "loadvision.application",
    "loadvision.domain",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
