[project]
name = "loadvision"
version = "0.1.0"
description = "Truck cargo load estimation from photos with an XML API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["baseline", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "T20", "PTH", "D"]
# D1: docstrings are not forced on every object; RUF001-003: Cyrillic text is expected.
ignore = ["D1", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["loadvision", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["baseline", "data", "runs", "storage", "**/__pycache__"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["src/loadvision/domain", "src/loadvision/application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The console pytest does not put the project root on sys.path; tests import tests.builders and
# tests.fakes from it.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
markers = [
    "unit: fast tests without external services",
    "contract: XML responses checked against the XSD",
    "api: HTTP API behavior",
    "ml: pipeline stages on synthetic data",
    "integration: tests with a real Postgres",
    "e2e: full service scenarios",
    "data: quality regression on the real dataset",
]

[tool.importlinter]
root_package = "loadvision"
# External packages join the import graph, so forbidden contracts can name frameworks.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entry points -> adapters -> application -> domain"
type = "layers"
layers = [
    "loadvision.api | loadvision.cli",
    "loadvision.infrastructure | loadvision.ml",
    "loadvision.application",
    "loadvision.domain",
]

[[tool.importlinter.contracts]]
name = "Domain imports no frameworks"
type = "forbidden"
source_modules = ["loadvision.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "psycopg",
    "alembic",
    "pydantic",
    "pydantic_xml",
    "lxml",
    "yaml",
    "structlog",
    "PIL",
    "numpy",
    "sklearn",
    "torch",
    "torchvision",
    "timm",
    "onnxruntime",
]

[[tool.importlinter.contracts]]
name = "Application imports no web, database, XML or ML frameworks"
type = "forbidden"
source_modules = ["loadvision.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "psycopg",
    "alembic",
    "pydantic_xml",
    "lxml",
    "sklearn",
    "torch",
    "torchvision",
    "timm",
    "onnxruntime",
]

# Shared modules are outside the layers and anyone may import them. If they imported a layer
# or an ML runtime, the service would pull it in, e.g. torch through imaging.
[[tool.importlinter.contracts]]
name = "Shared modules import no project layers and no ML runtime"
type = "forbidden"
source_modules = [
    "loadvision.errors",
    "loadvision.settings",
    "loadvision.observability",
    "loadvision.imaging",
]
forbidden_modules = [
    "loadvision.domain",
    "loadvision.application",
    "loadvision.infrastructure",
    "loadvision.ml",
    "loadvision.api",
    "loadvision.cli",
    "torch",
    "torchvision",
    "timm",
    "onnxruntime",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "types-lxml>=2026.2.16",
]

[tool.uv]
# Every dependency group installs by default, so pyright and import-linter see all imports.
# Service images should pick their groups explicitly.
default-groups = "all"
