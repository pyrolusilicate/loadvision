[project]
name = "loadvision"
version = "0.1.0"
description = "Truck cargo load estimation from photos with an XML API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
loadvision = "loadvision.cli.main:main"
loadvision-worker = "loadvision.worker.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["baseline", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "T20", "PTH", "D"]
# D1: docstrings are not forced on every object; RUF001-003: Cyrillic text is expected.
ignore = ["D1", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["loadvision", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["baseline", "data", "runs", "storage", "**/__pycache__"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["src/loadvision/domain", "src/loadvision/application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The console pytest does not put the project root on sys.path; tests import tests.builders and
# tests.fakes from it.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
markers = [
    "unit: fast tests without external services",
    "contract: XML responses checked against the XSD",
    "api: HTTP API behavior",
    "ml: pipeline stages on synthetic data",
    "integration: tests with a real Postgres",
    "e2e: full service scenarios",
    "data: quality regression on the real dataset",
]

[tool.importlinter]
root_package = "loadvision"
# External packages join the import graph, so forbidden contracts can name frameworks.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entry points -> adapters -> application -> domain"
type = "layers"
layers = [
    "loadvision.api | loadvision.cli",
    "loadvision.infrastructure | loadvision.ml",
    "loadvision.application",
    "loadvision.domain",
]

[[tool.importlinter.contracts]]
name = "Domain imports no frameworks"
type = "forbidden"
source_modules = ["loadvision.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "psycopg",
    "alembic",
    "pydantic",
    "pydantic_xml",
    "lxml",
    "yaml",
    "structlog",
    "PIL",
    "numpy",
    "sklearn",
    "torch",
    "torchvision",
    "timm",
    "onnxruntime",
]

[[tool.importlinter.contracts]]
name = "Application imports no web, database, XML or ML frameworks"
type = "forbidden"
source_modules = ["loadvision.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "psycopg",
    "alembic",
    "pydantic_xml",
    "lxml",
    "sklearn",
    "torch",
    "torchvision",
    "timm",
    "onnxruntime",
]

# Shared modules are outside the layers and anyone may import them. If they imported a layer
# or an ML runtime, the service would pull it in, e.g. torch through imaging.
[[tool.importlinter.contracts]]
name = "Shared modules import no project layers and no ML runtime"
type = "forbidden"
source_modules = [
    "loadvision.errors",
    "loadvision.settings",
    "loadvision.observability",
    "loadvision.imaging",
]
forbidden_modules = [
    "loadvision.domain",
    "loadvision.application",
    "loadvision.infrastructure",
    "loadvision.ml",
    "loadvision.api",
    "loadvision.cli",
    "torch",
    "torchvision",
    "timm",
    "onnxruntime",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "import-linter>=2.15",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "types-lxml>=2026.2.16",
]
# What the service needs to run a package of torch members; the API image installs only this.
serve = [
    "timm>=1.0.29",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    # The depth network a package may carry is a transformers model; without it such a package
    # does not load, and the service would answer with the model it has instead.
    "transformers>=5.17.0",
]
ml = [
    { include-group = "serve" },
    "scikit-learn>=1.9.1",
]
# Which build of torch Linux gets; exactly one of the two, see [tool.uv.sources].
cpu = ["torch>=2.14.0", "torchvision>=0.29.0"]
cuda = ["torch>=2.14.0", "torchvision>=0.29.0"]

[tool.uv]
# Every group but `cuda` installs by default, so pyright and import-linter see all imports.
# Service images pick their groups explicitly; the GPU server swaps `cpu` for `cuda`.
default-groups = ["dev", "serve", "ml", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

# Linux gets one of two builds of torch. `cpu` for the images: the default Linux wheels pull
# CUDA libraries of several gigabytes. `cuda` for the GPU server: the default wheels need CUDA 13
# and driver 580, while the organizers' machine has driver 535, which runs CUDA 12. macOS keeps
# the PyPI build with MPS either way. torchvision is listed only so that it comes from the same
# index: a source applies to direct dependencies alone.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", group = "cuda", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", group = "cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
