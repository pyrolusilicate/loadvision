# Service settings. Secrets and connection strings come from the environment, see .env.example.
api:
  max_body_mb: 20
  request_id_header: X-Request-ID

images:
  max_decoded_mb: 15
  max_megapixels: 50
  min_side_px: 256
  allowed_formats: [jpeg, png, webp]

storage:
  images_dir: storage/images
  models_dir: storage/models

logging:
  format: json
  level: INFO

runs:
  dir: runs

model:
  version: baseline-v0

training:
  # The experiment the worker retrains with; the winner of the day 3 comparison.
  config: configs/experiments/ens4_apache_by_aspect.json
  data_dir: data
  device: cpu
  poll_seconds: 5
