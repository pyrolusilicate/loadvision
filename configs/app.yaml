# Service settings. Secrets and connection strings come from the environment, see .env.example.
api:
  max_body_mb: 20
  request_id_header: X-Request-ID

images:
  max_decoded_mb: 15
  max_megapixels: 50
  min_side_px: 256
  allowed_formats: [jpeg, png, webp]

review:
  # Below this the frame is too dark to judge the load by. The darkest photo of our dataset
  # of 1023 has 21.6, a photo shot in the dark has about 7, so nothing normal trips it.
  min_brightness: 20
  # Both lines below stand inside a band the model measures on itself: from the far edge of
  # its training photos to the distance at which a grey wall, a dark frame, a blown-out frame
  # and pure noise land. Nothing here is a distance, so nothing has to be re-measured by hand
  # when the model changes - the band moves with it.
  #
  # The shares were checked against two packages, whose scales differ threefold:
  #
  #             band          real photos   blurred      empty frames
  #   v2        0.23 - 0.59   up to 0.24    0.47         0.59 - 0.91
  #   v4        0.10 - 0.86   up to 0.09    0.17 - 0.33  0.86 - 0.91
  #
  # From here the frame goes to a person: past every real photo we measured, and low enough to
  # catch a badly blurred one on both packages.
  unusual_band_share: 0.05
  # From here the pages show no prediction at all. Above the blurred photos, which are bad but
  # still show a body worth judging, and below the empty frames on both packages.
  unreadable_band_share: 0.6

storage:
  images_dir: storage/images
  models_dir: storage/models
  # Drawn maps; deleting the folder costs nothing, the next request draws them again.
  heatmaps_dir: storage/heatmaps

logging:
  format: json
  level: INFO

runs:
  dir: runs

model:
  version: baseline-v0
  # The service follows the version the database names active, whoever activated it.
  check_seconds: 5
  retry_seconds: 60
  # The GPU when torch sees one, otherwise the CPU: one file for a laptop, the images and the
  # GPU server.
  device: auto

training:
  # The experiment the worker retrains with; the winner of the day 3 comparison.
  config: configs/experiments/ens4_apache_by_aspect.json
  data_dir: data
  device: auto
  poll_seconds: 5
