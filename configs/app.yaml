# Service settings. Secrets and connection strings come from the environment, see .env.example.
api:
  max_body_mb: 20
  request_id_header: X-Request-ID

images:
  max_decoded_mb: 15
  max_megapixels: 50
  min_side_px: 256
  allowed_formats: [jpeg, png, webp]

review:
  # Below this the frame is too dark to judge the load by. The darkest photo of our dataset
  # of 1023 has 21.6, a photo shot in the dark has about 7, so nothing normal trips it.
  min_brightness: 20
  # From here the pages show no prediction at all. Measured on v2: a grey, black, white or
  # noise frame, a photo of paper and a closed lens score 0.59 to 0.91, a strongly blurred
  # photo 0.47, while the most unusual real photo of 1023 scores 0.24.
  unreadable_ood: 0.45

storage:
  images_dir: storage/images
  models_dir: storage/models

logging:
  format: json
  level: INFO

runs:
  dir: runs

model:
  version: baseline-v0
  # The service follows the version the database names active, whoever activated it.
  check_seconds: 5
  retry_seconds: 60
  # The GPU when torch sees one, otherwise the CPU: one file for a laptop, the images and the
  # GPU server.
  device: auto

training:
  # The experiment the worker retrains with; the winner of the day 3 comparison.
  config: configs/experiments/ens4_apache_by_aspect.json
  data_dir: data
  device: auto
  poll_seconds: 5
